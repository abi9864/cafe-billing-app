name: Deploy Cafe Billing App

on:
  push:
    branches: [dev]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  AR_REPO: cafe-billing
  DB_INSTANCE: cafe-billing-db
  DB_NAME: cafe_billing
  DB_USER: cafe_app
  VPC_CONNECTOR: institute-ai-vpc-conn
  GCS_BUCKET_NAME: pysellers-cafe-billing-images

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:latest" ./backend
          docker push "$IMAGE"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:latest"

      - id: deploy
        name: Deploy backend to Cloud Run
        run: |
          DB_CONN="${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}"

          gcloud run deploy cafe-backend \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=80 \
            --timeout=60 \
            --vpc-connector="${{ env.VPC_CONNECTOR }}" \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances="$DB_CONN" \
            --set-env-vars="NODE_ENV=production,DB_HOST=/cloudsql/${DB_CONN},DB_PORT=5432,DB_NAME=${{ env.DB_NAME }},DB_USER=${{ env.DB_USER }},JWT_EXPIRES_IN=24h,GCS_BUCKET_NAME=${{ env.GCS_BUCKET_NAME }}" \
            --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,CORS_ORIGIN=CORS_ORIGIN:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,ALERT_EMAIL_TO=ALERT_EMAIL_TO:latest" \
            --quiet

          URL=$(gcloud run services describe cafe-backend --region="${{ env.REGION }}" --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend deployed at: $URL"

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push frontend image
        run: |
          BACKEND_URL="${{ needs.deploy-backend.outputs.backend_url }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}"

          docker build \
            --build-arg VITE_API_URL="${BACKEND_URL}/api" \
            -t "$IMAGE" \
            -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest" \
            ./frontend
          docker push "$IMAGE"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest"

      - name: Deploy frontend to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}"

          gcloud run deploy cafe-frontend \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=100 \
            --quiet

          URL=$(gcloud run services describe cafe-frontend --region="${{ env.REGION }}" --format="value(status.url)")
          echo "Frontend deployed at: $URL"
