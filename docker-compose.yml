version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cafe_billing_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cafe_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cafe_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cafe_network:
    driver: bridge
