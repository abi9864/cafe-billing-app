server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — used so proxy_pass below resolves
    # "backend" lazily per-request instead of at config-load time. This
    # matters because on Cloud Run these /api/ and /uploads/ locations are
    # never actually hit (the frontend calls the backend's real URL directly
    # via VITE_API_URL baked in at build time) — but nginx still validates
    # every proxy_pass hostname at STARTUP unless it's a variable, and
    # "backend" doesn't exist as a DNS name outside docker-compose. Without
    # this, nginx crashes on boot in Cloud Run with "host not found in
    # upstream". Using a variable defers that resolution until a request
    # actually arrives, which never happens in the Cloud Run deployment.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream/uploads/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
